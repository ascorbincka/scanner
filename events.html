<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Events — Port Scan Protection</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      padding-top: 60px;
    }
    .event-card {
      border-left: 4px solid #6c757d;
    }
    .event-card.attack {
      border-left-color: #dc3545;
    }
    .event-card.suspicious {
      border-left-color: #ffc107;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Port Scan Protection</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="incidents.html">Инциденты</a></li>
          <li class="nav-item"><a class="nav-link" href="blocklist.html">Blocklist</a></li>
          <li class="nav-item"><a class="nav-link active" href="events.html">Events</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3">Лента событий</h1>
      <button id="refreshBtn" class="btn btn-sm btn-primary">Обновить</button>
    </div>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <div id="eventsContainer" class="vstack gap-2">
      <!-- Cards here -->
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { getRecentEvents } from "./api.js";

    const eventsContainer = document.getElementById("eventsContainer");
    const refreshBtn = document.getElementById("refreshBtn");
    const alertBox = document.getElementById("alertBox");

    function showAlert(message, type = "success") {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
    }

    function hideAlert() {
      alertBox.className = "alert d-none";
      alertBox.textContent = "";
    }

    function classifyEvent(ev) {
      // Очень простая "оценка": если dest_port < 1024 — suspicious,
      // если порт 22/3389/445 — attack, иначе normal.
      const port = ev.dest_port;
      if ([22, 3389, 445].includes(port)) return "attack";
      if (port < 1024) return "suspicious";
      return "normal";
    }

    function renderEvents(events) {
      eventsContainer.innerHTML = "";
      if (!events || events.length === 0) {
        eventsContainer.innerHTML =
          '<div class="text-muted text-center">Событий пока нет</div>';
        return;
      }

      for (const ev of events) {
        const level = classifyEvent(ev);
        let badgeClass = "bg-secondary";
        let badgeText = "normal";
        if (level === "attack") {
          badgeClass = "bg-danger";
          badgeText = "attack";
        } else if (level === "suspicious") {
          badgeClass = "bg-warning text-dark";
          badgeText = "suspicious";
        }

        const card = document.createElement("div");
        card.className = `card event-card ${level}`;
        card.innerHTML = `
          <div class="card-body py-2">
            <div class="d-flex justify-content-between">
              <div>
                <div>
                  <span class="badge ${badgeClass} me-2">${badgeText}</span>
                  <code>${ev.source_ip}</code>
                  <span class="mx-1">→</span>
                  <code>${ev.dest_ip}:${ev.dest_port}</code>
                </div>
                <div class="text-muted small mt-1">
                  protocol: ${ev.protocol || "TCP"}
                </div>
              </div>
              <div class="text-end text-muted small">
                ${ev.timestamp ? new Date(ev.timestamp).toLocaleString() : ""}
              </div>
            </div>
          </div>
        `;
        eventsContainer.appendChild(card);
      }
    }

    async function loadEvents() {
      hideAlert();
      try {
        const events = await getRecentEvents(50);
        // предполагаем, что backend отдаёт уже отсортированные по времени
        renderEvents(events);
      } catch (err) {
        console.error(err);
        showAlert("Ошибка загрузки событий: " + err.message, "danger");
      }
    }

    refreshBtn.addEventListener("click", loadEvents);
    loadEvents();
    setInterval(loadEvents, 7000); // автообновление каждые 7 секунд
  </script>
</body>
</html>
