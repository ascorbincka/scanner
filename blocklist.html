<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Blocklist — Port Scan Protection</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      padding-top: 60px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Port Scan Protection</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="incidents.html">Инциденты</a></li>
          <li class="nav-item"><a class="nav-link active" href="blocklist.html">Blocklist</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1 class="h3 mb-3">Blocklist</h1>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <h2 class="h5 mt-4">Заблокированные инциденты</h2>
    <table class="table table-striped table-hover align-middle">
      <thead>
        <tr>
          <th>ID инцидента</th>
          <th>Source IP</th>
          <th>Порты</th>
          <th>Severity</th>
          <th>Создан</th>
        </tr>
      </thead>
      <tbody id="blockedIncidentsBody"></tbody>
    </table>

    <h2 class="h5 mt-4">История запросов блокировки</h2>
    <table class="table table-sm table-striped table-hover align-middle">
      <thead>
        <tr>
          <th>ID запроса</th>
          <th>Incident ID</th>
          <th>Source IP</th>
          <th>Reason</th>
          <th>Created</th>
          <th>Executed</th>
        </tr>
      </thead>
      <tbody id="blockRequestsBody"></tbody>
    </table>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import {
      getIncidents,
      getBlockRequests,
    } from "./api.js";

    const blockedIncidentsBody = document.getElementById("blockedIncidentsBody");
    const blockRequestsBody = document.getElementById("blockRequestsBody");
    const alertBox = document.getElementById("alertBox");

    function showAlert(message, type = "success") {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
    }

    function hideAlert() {
      alertBox.className = "alert d-none";
      alertBox.textContent = "";
    }

    function renderBlockedIncidents(incidents) {
      blockedIncidentsBody.innerHTML = "";
      if (!incidents || incidents.length === 0) {
        blockedIncidentsBody.innerHTML =
          '<tr><td colspan="5" class="text-muted text-center">Заблокированных инцидентов нет</td></tr>';
        return;
      }
      for (const inc of incidents) {
        const tr = document.createElement("tr");
        const ports = Array.isArray(inc.ports)
          ? inc.ports.join(", ")
          : String(inc.ports || "");
        tr.innerHTML = `
          <td>${inc.id}</td>
          <td><code>${inc.source_ip}</code></td>
          <td>${ports}</td>
          <td>${inc.severity ?? ""}</td>
          <td>${inc.created_at ? new Date(inc.created_at).toLocaleString() : ""}</td>
        `;
        blockedIncidentsBody.appendChild(tr);
      }
    }

    function renderBlockRequests(requests) {
      blockRequestsBody.innerHTML = "";
      if (!requests || requests.length === 0) {
        blockRequestsBody.innerHTML =
          '<tr><td colspan="6" class="text-muted text-center">Запросов блокировки нет</td></tr>';
        return;
      }
      for (const r of requests) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.id}</td>
          <td>${r.incident_id}</td>
          <td><code>${r.source_ip}</code></td>
          <td>${r.reason}</td>
          <td>${r.created_at ? new Date(r.created_at).toLocaleString() : ""}</td>
          <td>${r.executed_at ? new Date(r.executed_at).toLocaleString() : ""}</td>
        `;
        blockRequestsBody.appendChild(tr);
      }
    }

    async function loadData() {
      hideAlert();
      try {
        const [blockedIncidents, blockRequests] = await Promise.all([
          getIncidents("blocked"),
          getBlockRequests(),
        ]);
        renderBlockedIncidents(blockedIncidents);
        renderBlockRequests(blockRequests);
      } catch (err) {
        console.error(err);
        showAlert("Ошибка загрузки Blocklist: " + err.message, "danger");
      }
    }

    loadData();
    setInterval(loadData, 15000); // обновляем каждые 15 сек
  </script>
</body>
</html>
