<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Инциденты — Port Scan Protection</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      padding-top: 60px;
    }
    .severity-badge {
      min-width: 40px;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Навбар -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Port Scan Protection</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="incidents.html">Инциденты</a></li>
          <li class="nav-item"><a class="nav-link" href="blocklist.html">Blocklist</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3">Инциденты</h1>
      <div>
        <select id="statusFilter" class="form-select form-select-sm d-inline-block w-auto me-2">
          <option value="">Все статусы</option>
          <option value="new">new</option>
          <option value="investigating">investigating</option>
          <option value="blocked">blocked</option>
          <option value="closed">closed</option>
        </select>
        <button id="refreshBtn" class="btn btn-sm btn-primary">Обновить</button>
      </div>
    </div>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <table class="table table-striped table-hover align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Source IP</th>
          <th>Порты</th>
          <th>Detection</th>
          <th>Severity</th>
          <th>Статус</th>
          <th>Создан</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="incidentsTableBody">
      </tbody>
    </table>
  </main>

  <!-- Bootstrap JS (для некоторых компонентов, не обязателен) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Наши скрипты -->
  <script type="module">
    import {
      getIncidents,
      updateIncidentStatus,
      createBlockRequest,
      executeBlockRequest,
    } from "./api.js";

    const tableBody = document.getElementById("incidentsTableBody");
    const statusFilter = document.getElementById("statusFilter");
    const refreshBtn = document.getElementById("refreshBtn");
    const alertBox = document.getElementById("alertBox");

    function showAlert(message, type = "success") {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
    }

    function hideAlert() {
      alertBox.className = "alert d-none";
      alertBox.textContent = "";
    }

    function severityBadge(severity) {
      if (severity === null || severity === undefined) return "";
      let cls = "bg-secondary";
      if (severity >= 80) cls = "bg-danger";
      else if (severity >= 60) cls = "bg-warning text-dark";
      else if (severity >= 40) cls = "bg-info text-dark";
      return `<span class="badge severity-badge ${cls}">${severity}</span>`;
    }

    function statusBadge(status) {
      const map = {
        new: "secondary",
        investigating: "warning text-dark",
        blocked: "danger",
        closed: "success",
      };
      const cls = map[status] || "secondary";
      return `<span class="badge bg-${cls}">${status}</span>`;
    }

    function renderIncidents(incidents) {
      tableBody.innerHTML = "";

      if (!incidents || incidents.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center text-muted">
              Инцидентов нет
            </td>
          </tr>`;
        return;
      }

      for (const inc of incidents) {
        const tr = document.createElement("tr");

        const ports = Array.isArray(inc.ports)
          ? inc.ports.join(", ")
          : String(inc.ports || "");

        tr.innerHTML = `
          <td>${inc.id}</td>
          <td><code>${inc.source_ip}</code></td>
          <td>${ports}</td>
          <td>${inc.detection_type || ""}</td>
          <td>${severityBadge(inc.severity)}</td>
          <td>${statusBadge(inc.status)}</td>
          <td>${inc.created_at ? new Date(inc.created_at).toLocaleString() : ""}</td>
          <td>
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-outline-primary btn-status" data-id="${inc.id}" data-status="investigating">Investigate</button>
              <button class="btn btn-outline-success btn-status" data-id="${inc.id}" data-status="closed">Close</button>
              <button class="btn btn-outline-danger btn-block-ip" data-id="${inc.id}" ${inc.status === "blocked" ? "disabled" : ""}>
                Block IP
              </button>
            </div>
          </td>
        `;
        tableBody.appendChild(tr);
      }
    }

    async function loadIncidents() {
      hideAlert();
      try {
        const status = statusFilter.value || null;
        const data = await getIncidents(status);
        renderIncidents(data);
      } catch (err) {
        console.error(err);
        showAlert("Ошибка загрузки инцидентов: " + err.message, "danger");
      }
    }

    // Обработка кликов по кнопкам в таблице (делегирование)
    tableBody.addEventListener("click", async (event) => {
      const target = event.target;
      if (target.classList.contains("btn-status")) {
        const id = Number(target.dataset.id);
        const newStatus = target.dataset.status;
        try {
          await updateIncidentStatus(id, newStatus);
          showAlert(`Статус инцидента #${id} изменён на ${newStatus}`, "success");
          await loadIncidents();
        } catch (err) {
          console.error(err);
          showAlert("Ошибка изменения статуса: " + err.message, "danger");
        }
      }

      if (target.classList.contains("btn-block-ip")) {
        const id = Number(target.dataset.id);
        const reason = prompt("Причина блокировки:", "Ручная блокировка из UI");
        if (!reason) return;
        try {
          const req = await createBlockRequest(id, reason);
          // сразу выполняем
          await executeBlockRequest(req.id);
          showAlert(`IP по инциденту #${id} заблокирован`, "success");
          await loadIncidents();
        } catch (err) {
          console.error(err);
          showAlert("Ошибка блокировки IP: " + err.message, "danger");
        }
      }
    });

    refreshBtn.addEventListener("click", loadIncidents);
    statusFilter.addEventListener("change", loadIncidents);

    // Первый запуск + автообновление
    loadIncidents();
    setInterval(loadIncidents, 10000); // обновление каждые 10 секунд
  </script>
</body>
</html>
